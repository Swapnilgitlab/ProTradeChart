name: Release

# Builds installers for Windows, macOS (Apple Silicon and Intel) and Linux and
# attaches them to a DRAFT GitHub release. Review the draft, then publish it.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in package.json and src-tauri/tauri.conf.json.
# The builds are not code-signed; see SECURITY.md.
#
# The app's auto-updater only accepts updates signed with the key whose public half is in
# tauri.conf.json (plugins.updater.pubkey). The private half must be in two repository
# secrets, or the build fails: TAURI_SIGNING_PRIVATE_KEY (the key file's contents) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. See CONTRIBUTING.md, "Releasing".
#
# Once every platform has uploaded, the `checksums` job attaches the source of the AGPL
# components the app is built from (PineTS, Vela PineTS and Vela, at the versions in
# package-lock.json) and then a SHA256SUMS file to the same draft release, so people can get
# the complete source and verify what they download (see SECURITY.md).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }} ${{ matrix.args }})
    # Every leg uploads to the same release, so they all report the same id.
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The installers carry THIRD_PARTY_LICENSES.txt; rebuild it from the lockfiles being
      # built, so a release can't ship a list that has fallen behind its dependencies.
      # On a macOS runner `cargo metadata --filter-platform` panics ("no entry found for key", in
      # cargo_output_metadata.rs, on Rust 1.98.1 and 1.99 alike) for the same lockfile Windows and
      # Linux read fine. The list is the same on every runner (each filters to the same four
      # desktop targets), so macOS bundles the committed file, and the Linux job fails the release
      # if that file has fallen behind the lockfiles; nothing ships a stale list.
      - name: Third-party licences
        if: matrix.platform != 'macos-latest'
        run: node scripts/third-party-licenses.mjs
      - name: Third-party licences are current
        if: matrix.platform == 'ubuntu-22.04'
        run: git diff --ignore-cr-at-eol --exit-code -- THIRD_PARTY_LICENSES.txt || (echo "::error::THIRD_PARTY_LICENSES.txt is out of date; run npm run licenses and commit it" && exit 1)

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ProTradeChart v__VERSION__"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed. These builds are unsigned — expect an OS warning on first launch. Check a download against the attached SHA256SUMS: see [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md#verifying-a-download)."
          releaseDraft: true
          # Uploads latest.json, the file installed apps check for a newer version.
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: SHA-256 checksums
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Attach the AGPL components' source to the release
        run: bash scripts/publish-component-sources.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}

      - name: Attach SHA256SUMS to the release
        run: bash scripts/publish-checksums.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
