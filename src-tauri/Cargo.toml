[package]
name = "protradechart"
version = "0.1.0"
description = "Open-source desktop charting software"
authors = ["ProTradeChart contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Swapnilgitlab/ProTradeChart"
edition = "2021"

[lib]
# The `_lib` suffix is required on Windows so the library name doesn't collide
# with the binary name (https://github.com/rust-lang/cargo/issues/8519).
name = "protradechart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
csv = "1.4.0"
base64 = "0.23.1"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }

# The OS credential store, per platform: Windows Credential Manager, the macOS
# Keychain, and the Secret Service (GNOME Keyring / KWallet) on Linux. Without a
# platform feature the crate falls back to a non-persistent mock, so each
# supported OS has to name one.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
