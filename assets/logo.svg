<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="160" y1="300" x2="864" y2="300"/>
    <line x1="160" y1="512" x2="864" y2="512"/>
    <line x1="160" y1="724" x2="864" y2="724"/>
  </g>

  <!-- candle 1: green, low -->
  <line x1="298" y1="560" x2="298" y2="800" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/>
  <rect x="246" y="610" width="104" height="140" rx="20" fill="url(#up)"/>

  <!-- candle 2: red pullback -->
  <line x1="512" y1="380" x2="512" y2="700" stroke="#f43f5e" stroke-width="22" stroke-linecap="round"/>
  <rect x="460" y="440" width="104" height="170" rx="20" fill="url(#down)"/>

  <!-- candle 3: green, high -->
  <line x1="726" y1="230" x2="726" y2="600" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/>
  <rect x="674" y="290" width="104" height="230" rx="20" fill="url(#up)"/>
</svg>
